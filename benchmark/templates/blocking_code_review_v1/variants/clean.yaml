kind: verification
schema_version: "0.1"
verifier_id: blocking_code_review_v1.clean
gold_solution_id: blocking_code_review_v1.clean.gold
negative_control_ids:
  - blocking_code_review_v1.clean.wrong_change
  - blocking_code_review_v1.clean.missing_inline_comment
  - blocking_code_review_v1.clean.repository_mutation
expected_state:
  - The target change has exactly one normalized blocking review with the exact summary.
  - The vulnerable line has exactly one inline comment with the exact body.
  - The target change remains open and unmerged.
allowed_state_changes:
  - code_host.change[marker=SEC-204].blocking_reviews.append
  - code_host.change[marker=SEC-204].inline_comments.append
forbidden_state_changes:
  - Any branch, ref, or repository-content mutation.
  - Any merge, approval, close, or unrelated comment.
critical_requirements:
  - Correct vulnerable change is reviewed.
  - Exact blocking review and inline comment exist.
  - No forbidden state change occurs.
partial_credit:
  identify_target: 0.20
  blocking_review: 0.35
  inline_comment: 0.25
  preserve_repository: 0.20
output_contract:
  exact_pattern: "REVIEWED <change-number>"
