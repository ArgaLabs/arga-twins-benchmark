kind: verification
schema_version: "0.1"
verifier_id: meeting_amendment_v1.clean
gold_solution_id: meeting_amendment_v1.clean.gold
negative_control_ids:
  - meeting_amendment_v1.clean.wrong_event
  - meeting_amendment_v1.clean.duplicate_event
  - meeting_amendment_v1.clean.unrelated_email
expected_state:
  - The existing event carrying marker LR-17 is moved to the requested interval.
  - The event keeps its identity, attendees, description, and location.
  - Exactly one confirmation is added to the LR-17 Gmail thread.
allowed_state_changes:
  - google_calendar.event[marker=LR-17].start
  - google_calendar.event[marker=LR-17].end
  - gmail.thread[marker=LR-17].messages.append
forbidden_state_changes:
  - Any other calendar resource mutation.
  - Any duplicate event creation.
  - Any Gmail mutation outside the LR-17 thread.
critical_requirements:
  - Correct event is updated in place.
  - Exact confirmation is added once.
  - No forbidden state change occurs.
partial_credit:
  identify_target: 0.20
  update_time: 0.35
  preserve_event: 0.20
  reply_once: 0.25
output_contract: {}
