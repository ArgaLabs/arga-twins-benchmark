kind: "instance"
schema_version: "0.1"
instance_id: "attendee_correction_v1_gmail_calendar_distractor_003"
template_id: "attendee_correction_v1"
variant_group: "attendee_correction_v1"
variant: "distractor"
split: "development"
world_id: "saas_company_01"
binding_id: "gmail_calendar"
prompt_file: "prompt.txt"
seed_files:
  gmail: "seed/gmail.json"
  google_calendar: "seed/google_calendar.json"
verification_file: "verification.yaml"
authorization:
  principal: "benchmark_user"
  tenant: "acme"
  allowed_actions:
    - "add_target_event_attendee"
  constraints:
    request_marker: "ATT-88"
    authorized_sender: "calendar-admin@acme.example"
complexity:
  minimum_agent_steps: 8
  minimum_tool_calls: 9
  agent_steps:
    - {id: enumerate_mailbox, kind: discover, description: "Enumerate the mailbox evidence once.", tool_interactions: [evidence_list]}
    - {id: retrieve_bundle, kind: retrieve, description: "Read the active bundle index and resolve its exact evidence set.", depends_on: [enumerate_mailbox], tool_interactions: [index_detail]}
    - {id: retrieve_policy, kind: retrieve, description: "Read the indexed attendee-correction policy.", depends_on: [retrieve_bundle], tool_interactions: [policy_detail]}
    - {id: validate_request, kind: correlate, description: "Check indexed authorization and read the exact ATT-88 request.", depends_on: [retrieve_policy], tool_interactions: [roster_detail, revocations_detail, request_detail]}
    - {id: discover_calendar, kind: discover, description: "Resolve Work among similar calendars.", depends_on: [validate_request], tool_interactions: [calendar_list]}
    - {id: locate_event, kind: retrieve, description: "Select the unique exact event from complete Work event records.", depends_on: [discover_calendar], tool_interactions: [events_search]}
    - {id: decide_patch, kind: decide, description: "Reject all request and event distractors and construct an attendee-only patch.", depends_on: [locate_event], tool_interactions: []}
    - {id: apply_correction, kind: mutate, description: "Apply the exact attendee-only patch once.", depends_on: [decide_patch], tool_interactions: [event_patch]}
  tool_interactions:
    - {id: evidence_list, provider_role: email, kind: read, target: "Calendar Operations mailbox index", purpose: "Discover all bundle and request message IDs in one listing."}
    - {id: index_detail, provider_role: email, kind: read, target: "CAL-OPS-INDEX message", purpose: "Resolve the current policy, roster, and revocations artifacts."}
    - {id: policy_detail, provider_role: email, kind: read, target: "CAL-OPS-POLICY-V2 message", purpose: "Read matching constraints."}
    - {id: roster_detail, provider_role: email, kind: read, target: "CAL-OPS-SENDERS-V3 message", purpose: "Read the exact authorized sender roster."}
    - {id: revocations_detail, provider_role: email, kind: read, target: "CAL-OPS-REVOCATIONS-V1 message", purpose: "Ensure the sender is not revoked."}
    - {id: request_detail, provider_role: email, kind: read, target: "ATT-88 message", purpose: "Read the exact requested correction."}
    - {id: calendar_list, provider_role: calendar, kind: read, target: "Calendar list", purpose: "Distinguish Work from Work Archive."}
    - {id: events_search, provider_role: calendar, kind: read, target: "Work event collection", purpose: "Compare similar summaries and times."}
    - {id: event_patch, provider_role: calendar, kind: write, target: "Exact target attendees", purpose: "Add only alex once."}
budget:
  timeout_seconds: 300
  max_tool_calls: 30
setup_patches:
  - "seed_attendee_request"
  - "seed_target_calendar_event"
  - "seed_event_distractors"
failure_schedule: []
metadata:
  service_count: 2
  controlled_clock: "2030-05-14T12:00:00Z"
  risk: "high"
