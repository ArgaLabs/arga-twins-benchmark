kind: instance
schema_version: "0.1"
instance_id: policy_promotion_v1_notion_idempotent_003
template_id: policy_promotion_v1
variant_group: policy_promotion_v1
variant: idempotent
split: development
world_id: saas_company_01
binding_id: notion
prompt_file: prompt.txt
seed_files: {notion: seed/notion.json}
verification_file: verification.yaml
authorization:
  principal: benchmark_user
  tenant: acme
  allowed_actions: []
  constraints: {promotion: POLICY-27, successor: POL-3, predecessor: POL-2}
complexity:
  minimum_agent_steps: 7
  minimum_tool_calls: 6
  agent_steps:
    - {id: discover_standard, kind: discover, description: "Discover the active PG-7 standard.", tool_interactions: [discover_standard]}
    - {id: read_standard, kind: retrieve, description: "Read authorization, evidence, and idempotency requirements.", depends_on: [discover_standard], tool_interactions: [read_standard]}
    - {id: retrieve_request, kind: retrieve, description: "Retrieve valid POLICY-27 request facts.", depends_on: [read_standard], tool_interactions: [query_request]}
    - {id: validate_approval, kind: correlate, description: "Match the valid confirmation token and approval digest.", depends_on: [retrieve_request], tool_interactions: [query_approval]}
    - {id: validate_attestation, kind: correlate, description: "Independently validate the Passed build attestation and digest.", depends_on: [validate_approval], tool_interactions: [query_attestation]}
    - {id: inspect_registry, kind: correlate, description: "Detect that the exact predecessor-successor pair already has both target lifecycle states.", depends_on: [validate_attestation], tool_interactions: [query_registry]}
    - {id: decide_noop, kind: decide, description: "Select an idempotent no-op after evaluating the complete authorization chain.", depends_on: [inspect_registry], tool_interactions: []}
  tool_interactions:
    - {id: discover_standard, provider_role: knowledge_base, kind: read, target: "POST /v1/search", purpose: "Resolve active PG-7."}
    - {id: read_standard, provider_role: knowledge_base, kind: read, target: "GET /v1/pages/bb1cddba-338e-5325-45f9-99add99c1ce3/markdown", purpose: "Read authority and idempotency requirements."}
    - {id: query_request, provider_role: knowledge_base, kind: read, target: "POST /v1/data_sources/fe55d721-b79e-8895-697a-ef3f1076ada0/query", purpose: "Read POLICY-27 from Promotion Requests."}
    - {id: query_approval, provider_role: knowledge_base, kind: read, target: "POST /v1/data_sources/7ae509a3-c74b-6732-54ca-94d081deaacc/query", purpose: "Validate exact approval evidence."}
    - {id: query_attestation, provider_role: knowledge_base, kind: read, target: "POST /v1/data_sources/0287220b-5037-3d54-e7ec-2dbdd0972291/query", purpose: "Validate independent Passed build evidence."}
    - {id: query_registry, provider_role: knowledge_base, kind: read, target: "POST /v1/data_sources/4bbaaf55-de27-7fa3-6aee-cc45cc0d8527/query", purpose: "Detect the already-complete lifecycle pair."}
budget: {timeout_seconds: 300, max_tool_calls: 30}
setup_patches: [seed_active_pg7_standard, seed_valid_promotion_evidence, seed_artifact_attestation, seed_already_promoted_registry]
failure_schedule: []
metadata: {service_count: 1, controlled_clock: "2030-05-14T12:00:00Z", risk: high}
