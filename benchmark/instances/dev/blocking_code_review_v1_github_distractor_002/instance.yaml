kind: instance
schema_version: "0.1"
instance_id: blocking_code_review_v1_github_distractor_002
template_id: blocking_code_review_v1
variant_group: blocking_code_review_v1
variant: distractor
split: development
world_id: saas_company_01
binding_id: github
prompt_file: prompt.txt
seed_files:
  github: seed/github.json
verification_file: verification.yaml
authorization:
  principal: benchmark_user
  tenant: acme
  allowed_actions:
    - submit_blocking_review
    - add_inline_review_comment
  constraints:
    change_marker: "SEC-204"
    target_change: "#2"
budget:
  timeout_seconds: 300
  max_tool_calls: 50
setup_patches:
  - seed_target_and_similar_safe_pull_requests
failure_schedule: []
metadata:
  service_count: 1
