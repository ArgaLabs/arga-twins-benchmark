kind: instance
schema_version: "0.1"
instance_id: runbook_publication_v1_drive_notion_discord_provider_contrast_004
template_id: runbook_publication_v1
variant_group: runbook_publication_v1
variant: provider_contrast
split: development
world_id: saas_company_01
binding_id: drive_notion_discord
prompt_file: prompt.txt
seed_files:
  google_drive: seed/google_drive.json
  notion: seed/notion.json
  discord: seed/discord.json
verification_file: verification.yaml
authorization:
  principal: benchmark_user
  tenant: acme
  allowed_actions:
    - replace_target_notion_markdown
    - announce_runbook_publication
  constraints:
    runbook_marker: "RB-80"
    selected_version: "2"
    status_channel: "operations"
complexity:
  minimum_agent_steps: 11
  minimum_tool_calls: 12
  agent_steps:
    - {id: discover_sources, kind: discover, description: "List the publication folder and candidates.", tool_interactions: [drive_list]}
    - {id: retrieve_policy, kind: retrieve, description: "Read the provider-neutral publication manifest.", depends_on: [discover_sources], tool_interactions: [manifest_read]}
    - {id: inspect_candidates, kind: correlate, description: "Compare matching and wrong-runbook revisions.", depends_on: [retrieve_policy], tool_interactions: [candidate_current_read, candidate_decoy_read, candidate_wrong_runbook_read]}
    - {id: resolve_destination, kind: discover, description: "Find the exact existing RB-80 destination page.", depends_on: [inspect_candidates], tool_interactions: [notion_search]}
    - {id: inspect_destination, kind: retrieve, description: "Read the resolved RB-80 destination markdown.", depends_on: [resolve_destination], tool_interactions: [notion_read]}
    - {id: resolve_chat_guild, kind: discover, description: "Resolve the seeded Acme Ops Discord guild.", depends_on: [inspect_destination], tool_interactions: [chat_guilds]}
    - {id: resolve_announcement_channel, kind: discover, description: "Resolve operations inside the exact Discord guild.", depends_on: [resolve_chat_guild], tool_interactions: [chat_channels]}
    - {id: inspect_announcement, kind: retrieve, description: "Inspect the resolved operations channel history for a prior publication.", depends_on: [resolve_announcement_channel], tool_interactions: [chat_history]}
    - {id: decide_publication, kind: decide, description: "Derive provider-native writes from the common policy.", depends_on: [inspect_destination, inspect_announcement], tool_interactions: []}
    - {id: update_destination, kind: mutate, description: "Update only the resolved RB-80 page with approved v2.", depends_on: [decide_publication], tool_interactions: [notion_write]}
    - {id: announce_publication, kind: mutate, description: "Announce approved v2 once in Discord operations after the page update succeeds.", depends_on: [update_destination], tool_interactions: [chat_write]}
  tool_interactions:
    - {id: drive_list, provider_role: file_storage, kind: read, target: "Drive Approved Runbooks folder", purpose: "Enumerate candidates."}
    - {id: manifest_read, provider_role: file_storage, kind: read, target: "publication-manifest.md", purpose: "Discover rules and Discord destination."}
    - {id: candidate_current_read, provider_role: file_storage, kind: read, target: "RB-80 v2 approved", purpose: "Read selected body."}
    - {id: candidate_decoy_read, provider_role: file_storage, kind: read, target: "RB-80 v3 draft", purpose: "Reject unapproved revision."}
    - {id: candidate_wrong_runbook_read, provider_role: file_storage, kind: read, target: "RB-08 v8", purpose: "Reject a high version for a different runbook."}
    - {id: notion_search, provider_role: knowledge_base, kind: read, target: "Notion page search", purpose: "Resolve existing destination."}
    - {id: notion_read, provider_role: knowledge_base, kind: read, target: "RB-80 markdown", purpose: "Compare stale content."}
    - {id: chat_guilds, provider_role: team_chat, kind: read, target: "Discord current-user guilds", purpose: "Resolve the exact Acme Ops guild."}
    - {id: chat_channels, provider_role: team_chat, kind: read, target: "Acme Ops guild channels", purpose: "Resolve operations channel."}
    - {id: chat_history, provider_role: team_chat, kind: read, target: "Discord operations history", purpose: "Prevent duplicate announcement."}
    - {id: notion_write, provider_role: knowledge_base, kind: write, target: "RB-80 markdown", purpose: "Publish selected body in place."}
    - {id: chat_write, provider_role: team_chat, kind: write, target: "Discord operations message", purpose: "Announce the publication once."}
budget:
  timeout_seconds: 300
  max_tool_calls: 55
setup_patches:
  - seed_runbook_on_discord_contrast_binding
failure_schedule: []
metadata:
  service_count: 3
