kind: instance
schema_version: "0.1"
instance_id: release_readiness_v1_github_jira_slack_notion_distractor_002
template_id: release_readiness_v1
variant_group: release_readiness_v1
variant: distractor
split: development
world_id: saas_company_01
binding_id: github_jira_slack_notion
prompt_file: prompt.txt
seed_files:
  github: seed/github.json
  jira: seed/jira.json
  slack: seed/slack.json
  notion: seed/notion.json
verification_file: verification.yaml
authorization:
  principal: benchmark_user
  tenant: acme
  allowed_actions:
    - comment_on_release_record
    - publish_release_status
    - complete_ready_release_record
  constraints:
    release_marker: "REL-205"
    release_record: "REL-1"
    status_channel: "releases"
complexity:
  minimum_agent_steps: 8
  minimum_tool_calls: 13
  agent_steps:
    - id: discover_release_sources
      kind: discover
      description: Find policy and target checklist among future-release distractors.
      tool_interactions: [search_release_pages]
    - id: retrieve_release_rules
      kind: retrieve
      description: Read target checklist and policy while excluding REL-250 instructions.
      depends_on: [discover_release_sources]
      tool_interactions: [read_release_policy, read_release_checklist]
    - id: verify_code_gates
      kind: retrieve
      description: Resolve the referenced target change rather than unrelated or future work.
      depends_on: [retrieve_release_rules]
      tool_interactions: [read_required_change]
    - id: verify_tracker_gates
      kind: correlate
      description: Join the target blocker and release record, then resolve its completion transition without touching future records.
      depends_on: [verify_code_gates]
      tool_interactions: [read_tracker_gates, read_release_transitions]
    - id: preflight_publication
      kind: retrieve
      description: Resolve channel history and distinguish the existing REL-250 status.
      depends_on: [verify_tracker_gates]
      tool_interactions: [list_release_channels, read_release_channel]
    - id: decide_readiness
      kind: decide
      description: Apply gate precedence only to REL-205 evidence.
      depends_on: [preflight_publication]
    - id: record_and_publish
      kind: mutate
      description: Update only REL-1 and publish one REL-205 status.
      depends_on: [decide_readiness]
      tool_interactions: [comment_release_record, transition_release_record, publish_release_status]
    - id: confirm_release_outcome
      kind: confirm
      description: Confirm target outcome and preservation of source and future-release state.
      depends_on: [record_and_publish]
      tool_interactions: [confirm_release_record, confirm_release_channel]
  tool_interactions:
    - {id: search_release_pages, provider_role: knowledge_base, kind: read, target: POST /v1/search, purpose: Locate policy and REL-205 among REL-250 distractors.}
    - {id: read_release_policy, provider_role: knowledge_base, kind: read, target: GET /v1/pages/bb1cddba-338e-5325-45f9-99add99c1ce3, purpose: Retrieve gate ordering and target-only update rules.}
    - {id: read_release_checklist, provider_role: knowledge_base, kind: read, target: GET /v1/pages/569ac0fe-f39a-5497-e088-65dead32bf2f, purpose: Retrieve only authoritative REL-205 references.}
    - {id: read_required_change, provider_role: code_host, kind: read, target: GET /repos/acme/payments/pulls/3, purpose: Verify the checklist-referenced target change is merged.}
    - {id: read_tracker_gates, provider_role: issue_tracker, kind: read, target: "GET /rest/api/3/search?jql=project=REL", purpose: Resolve REL-1 and REL-2 while preserving REL-250 issues.}
    - {id: read_release_transitions, provider_role: issue_tracker, kind: read, target: GET /rest/api/3/issue/REL-1/transitions, purpose: Resolve the target record's completion transition.}
    - {id: list_release_channels, provider_role: team_chat, kind: read, target: POST /api/conversations.list, purpose: Resolve releases channel.}
    - {id: read_release_channel, provider_role: team_chat, kind: read, target: POST /api/conversations.history, purpose: Distinguish existing future-release status from target publication.}
    - {id: comment_release_record, provider_role: issue_tracker, kind: write, target: POST /rest/api/3/issue/REL-1/comment, purpose: Record target readiness.}
    - {id: transition_release_record, provider_role: issue_tracker, kind: write, target: POST /rest/api/3/issue/REL-1/transitions, purpose: Complete the READY target only.}
    - {id: publish_release_status, provider_role: team_chat, kind: write, target: POST /api/chat.postMessage, purpose: Publish one target status without altering history.}
    - {id: confirm_release_record, provider_role: issue_tracker, kind: read, target: GET /rest/api/3/issue/REL-1, purpose: Confirm target state and one comment.}
    - {id: confirm_release_channel, provider_role: team_chat, kind: read, target: POST /api/conversations.history, purpose: Confirm one REL-205 publication and preserved REL-250 history.}
budget:
  timeout_seconds: 300
  max_tool_calls: 70
setup_patches:
  - seed_target_and_future_release_distractors
failure_schedule: []
metadata:
  service_count: 4
