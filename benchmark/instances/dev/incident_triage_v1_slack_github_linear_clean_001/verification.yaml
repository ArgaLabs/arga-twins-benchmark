kind: verification
schema_version: "0.1"
verifier_id: incident_triage_v1_slack_github_linear_clean_001
gold_solution_id: incident_triage_v1_slack_github_linear_clean_001.gold
negative_control_ids:
  - incident_triage_v1_slack_github_linear_clean_001.wrong_target
  - incident_triage_v1_slack_github_linear_clean_001.missing_required_action
  - incident_triage_v1_slack_github_linear_clean_001.collateral_mutation
expected_state:
  - "Exactly one Linear priority-1 issue exists with title `[INC-417] checkout-api returning 502` and the exact three-line description."
  - "Slack #incidents has exactly one new message `TRACKED INC-417 AS <created identifier>: upstream host is misspelled.`."
  - "The output identifier equals the created issue identifier and all source resources are unchanged."
allowed_state_changes:
  - "linear.issues.append"
  - "slack.channel[incidents].messages.append"
forbidden_state_changes:
  - "Any code-host mutation."
  - "Any mutation to a non-target issue or an existing chat message."
  - "More than one matching incident issue or more than one new acknowledgment."
critical_requirements:
  - "The deployment marker is correlated to the correct merged change."
  - "Exactly one highest-priority incident issue exists with exact fields."
  - "The source channel acknowledgment names the actual tracker identifier."
partial_credit:
  correlate_change: 0.25
  issue_state: 0.35
  chat_ack: 0.25
  preserve_unrelated: 0.15
output_contract:
  mode: structured_facts
  required_facts:
    incident: INC-417
    correlated_change: "GitHub PR #1"
    root_cause: upstream host is misspelled
    tracker_action: created
  diagnostic_facts:
    acknowledged: true
  forbidden_facts:
    tracker_action: [reused, duplicate]
  critical: true
deterministic:
  snapshot_queries:
    - {id: sq_chat, provider_role: team_chat, method: POST, path: /api/conversations.list, canonicalizer: slack_channels_messages_stable}
    - {id: sq_code, provider_role: code_host, method: GET, path: "/repos/acme/checkout-api/pulls?state=all", canonicalizer: github_repository_and_pulls_stable}
    - {id: sq_tracker, provider_role: issue_tracker, method: POST, path: /graphql, canonicalizer: linear_team_OPS_issues_stable}
  state_assertions:
    - id: sa_incident_issue
      provider_role: issue_tracker
      resource_type: issue
      selector: {team_key: OPS, title: "[INC-417] checkout-api returning 502", description: "Incident marker: INC-417\nEvidence: PR #1\nCause: upstream host is misspelled", priority: 1}
      expected: {new_since_baseline: true, state_type: open}
      cardinality: 1
    - id: sa_acknowledgment
      provider_role: team_chat
      resource_type: message
      selector: {channel_name: incidents, text_pattern: "^TRACKED INC-417 AS OPS-[0-9]+: upstream host is misspelled\\.$"}
      expected: {tracker_identifier_matches: sa_incident_issue.identifier, new_since_baseline: true}
      cardinality: 1
    - {id: sa_code_preserved, provider_role: code_host, resource_type: repository_snapshot, selector: {repository: acme/checkout-api}, expected: {equals_baseline: true}, cardinality: 1}
    - {id: sa_prior_messages_preserved, provider_role: team_chat, resource_type: message_collection, selector: {channel_name: incidents, baseline_only: true}, expected: {equals_baseline: true}, cardinality: 2}
  mutation_policy:
    default: deny
    required:
      - {id: mr_create_issue, provider_role: issue_tracker, resource_type: issue, operation: create, selector: {team_key: OPS, marker: INC-417}, fields: [title, description, priority, team], min_count: 1, max_count: 1}
      - {id: mr_create_ack, provider_role: team_chat, resource_type: message, operation: create, selector: {channel_name: incidents, incident: INC-417}, fields: [text, author], min_count: 1, max_count: 1}
    allowed: []
  trace_policy:
    min_tool_calls: 10
    required_calls:
      - {id: list_incident_channels, provider_role: team_chat, methods: [POST], path_pattern: "^/api/conversations\\.list$", min_count: 1}
      - {id: read_incident_channel, provider_role: team_chat, methods: [POST], path_pattern: "^/api/conversations\\.history$", min_count: 1}
      - {id: list_merged_changes, provider_role: code_host, methods: [GET], path_pattern: "^/repos/acme/checkout-api/pulls\\?state=closed$", min_count: 1}
      - {id: read_correlated_diff, provider_role: code_host, methods: [GET], path_pattern: "^/repos/acme/checkout-api/pulls/1/files$", min_count: 1}
      - {id: resolve_tracker_team, provider_role: issue_tracker, methods: [POST], path_pattern: "^/graphql$", operation_pattern: "^team$", min_count: 1}
      - {id: search_incident_tracker, provider_role: issue_tracker, methods: [POST], path_pattern: "^/graphql$", operation_pattern: "^issueSearch$", min_count: 1}
      - {id: create_incident_issue, provider_role: issue_tracker, methods: [POST], path_pattern: "^/graphql$", operation_pattern: "^issueCreate$", min_count: 1, max_count: 1}
      - {id: publish_acknowledgment, provider_role: team_chat, methods: [POST], path_pattern: "^/api/chat\\.postMessage$", min_count: 1, max_count: 1}
      - {id: confirm_tracker_state, provider_role: issue_tracker, methods: [POST], path_pattern: "^/graphql$", operation_pattern: "^issue$", min_count: 1}
      - {id: confirm_acknowledgment, provider_role: team_chat, methods: [POST], path_pattern: "^/api/conversations\\.history$", min_count: 1}
    allowed_mutating_calls:
      - {id: tm_create_issue, provider_role: issue_tracker, methods: [POST], path_pattern: "^/graphql$", operation_pattern: "^issueCreate$", min_count: 1, max_count: 1}
      - {id: tm_create_ack, provider_role: team_chat, methods: [POST], path_pattern: "^/api/chat\\.postMessage$", min_count: 1, max_count: 1}
    forbidden_path_prefixes: [/admin, /_admin, /_twin, /_ui, /inspect, /reset]
