kind: instance
schema_version: "0.1"
instance_id: release_readiness_v1_github_jira_slack_notion_operational_hurdle_003
template_id: release_readiness_v1
variant_group: release_readiness_v1
variant: operational_hurdle
split: development
world_id: saas_company_01
binding_id: github_jira_slack_notion
prompt_file: prompt.txt
seed_files:
  github: seed/github.json
  jira: seed/jira.json
  slack: seed/slack.json
  notion: seed/notion.json
verification_file: verification.yaml
authorization:
  principal: benchmark_user
  tenant: acme
  allowed_actions:
    - comment_on_release_record
  constraints:
    release_marker: "REL-206"
    release_record: "REL-1"
    status_channel: "releases"
complexity:
  minimum_agent_steps: 8
  minimum_tool_calls: 10
  agent_steps:
    - id: discover_release_sources
      kind: discover
      description: Find the release policy and target checklist.
      tool_interactions: [search_release_pages]
    - id: retrieve_release_rules
      kind: retrieve
      description: Read gate order, references, and partial-publication reconciliation rules.
      depends_on: [discover_release_sources]
      tool_interactions: [read_release_policy, read_release_checklist]
    - id: verify_code_gates
      kind: retrieve
      description: Check both required changes in policy order and identify the first failed gate.
      depends_on: [retrieve_release_rules]
      tool_interactions: [read_required_change_one, read_required_change_two]
    - id: verify_tracker_gates
      kind: correlate
      description: Resolve tracker blocker and authoritative release record without repairing gates.
      depends_on: [verify_code_gates]
      tool_interactions: [read_tracker_gates]
    - id: preflight_publication
      kind: retrieve
      description: Resolve the channel and detect the already-published target status before writing.
      depends_on: [verify_tracker_gates]
      tool_interactions: [list_release_channels, read_release_channel]
    - id: decide_blocked_outcome
      kind: decide
      description: Derive the first code-gate failure and decide to reuse the existing status without duplication.
      depends_on: [preflight_publication]
    - id: reconcile_release_record
      kind: mutate
      description: Add the missing tracker comment while leaving the existing channel status untouched.
      depends_on: [decide_blocked_outcome]
      tool_interactions: [comment_release_record]
    - id: confirm_reconciled_outcome
      kind: confirm
      description: Confirm the missing tracker artifact was added exactly once after reconciliation.
      depends_on: [reconcile_release_record]
      tool_interactions: [confirm_release_record]
  tool_interactions:
    - {id: search_release_pages, provider_role: knowledge_base, kind: read, target: POST /v1/search, purpose: Locate policy and REL-206 checklist.}
    - {id: read_release_policy, provider_role: knowledge_base, kind: read, target: GET /v1/pages/bb1cddba-338e-5325-45f9-99add99c1ce3, purpose: Retrieve gate ordering and partial-publication reconciliation rules.}
    - {id: read_release_checklist, provider_role: knowledge_base, kind: read, target: GET /v1/pages/569ac0fe-f39a-5497-e088-65dead32bf2f, purpose: Retrieve REL-206 references and expected gates.}
    - {id: read_required_change_one, provider_role: code_host, kind: read, target: GET /repos/acme/payments/pulls/1, purpose: Verify the first required change before applying precedence.}
    - {id: read_required_change_two, provider_role: code_host, kind: read, target: GET /repos/acme/payments/pulls/2, purpose: Establish the first failed code gate.}
    - {id: read_tracker_gates, provider_role: issue_tracker, kind: read, target: "GET /rest/api/3/search?jql=project=REL", purpose: Resolve record and completed blocker state.}
    - {id: list_release_channels, provider_role: team_chat, kind: read, target: POST /api/conversations.list, purpose: Resolve releases channel.}
    - {id: read_release_channel, provider_role: team_chat, kind: read, target: POST /api/conversations.history, purpose: Establish that the exact REL-206 status already exists and must not be reposted.}
    - {id: comment_release_record, provider_role: issue_tracker, kind: write, target: POST /rest/api/3/issue/REL-1/comment, purpose: Record blocked decision without transition.}
    - {id: confirm_release_record, provider_role: issue_tracker, kind: read, target: GET /rest/api/3/issue/REL-1, purpose: Confirm unchanged status and one comment.}
budget:
  timeout_seconds: 300
  max_tool_calls: 70
setup_patches:
  - seed_one_unmerged_required_change
  - seed_status_published_before_tracker_comment
failure_schedule: []
metadata:
  service_count: 4
