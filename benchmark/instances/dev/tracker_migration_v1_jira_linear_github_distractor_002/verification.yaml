kind: verification
schema_version: "0.1"
verifier_id: tracker_migration_v1_jira_linear_github_distractor_002
gold_solution_id: tracker_migration_v1_jira_linear_github_distractor_002.gold
negative_control_ids:
  - tracker_migration_v1_jira_linear_github_distractor_002.wrong_target
  - tracker_migration_v1_jira_linear_github_distractor_002.missing_required_action
  - tracker_migration_v1_jira_linear_github_distractor_002.collateral_mutation
expected_state:
  - "Exactly one new Linear target is created from Jira OPS-3 with priority 2 and `Migration source: OPS-3`."
