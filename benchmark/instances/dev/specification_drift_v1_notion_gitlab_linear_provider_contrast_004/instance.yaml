kind: instance
schema_version: "0.1"
instance_id: specification_drift_v1_notion_gitlab_linear_provider_contrast_004
template_id: specification_drift_v1
variant_group: specification_drift_v1
variant: provider_contrast
split: development
world_id: saas_company_01
binding_id: notion_gitlab_linear
prompt_file: prompt.txt
seed_files:
  notion: seed/notion.json
  gitlab: seed/gitlab.json
  linear: seed/linear.json
verification_file: verification.yaml
authorization:
  principal: benchmark_user
  tenant: acme
  allowed_actions:
    - create_missing_tracker_issue
  constraints:
    spec_marker: "SPEC-91:R1"
    code_path: "runner.py"
complexity:
  minimum_agent_steps: 8
  minimum_tool_calls: 8
  agent_steps:
    - id: discover_specification_material
      kind: discover
      description: Search the knowledge base for the audit policy and target specification.
      tool_interactions: [search_spec_pages]
    - id: retrieve_audit_contract
      kind: retrieve
      description: Read the audit policy before interpreting the specification.
      depends_on: [discover_specification_material]
      tool_interactions: [read_audit_policy]
    - id: retrieve_target_specification
      kind: retrieve
      description: Read the approved target and enumerate every MUST requirement and referenced code path.
      depends_on: [retrieve_audit_contract]
      tool_interactions: [read_target_spec]
    - id: inspect_requirement_implementation
      kind: retrieve
      description: Inspect the referenced file through the contrast code-host API.
      depends_on: [retrieve_target_specification]
      tool_interactions: [read_requirement_code]
    - id: reconcile_tracker_work
      kind: correlate
      description: Resolve the target team and query open work carrying the requirement marker.
      depends_on: [inspect_requirement_implementation]
      tool_interactions: [resolve_tracker_team, search_tracker_markers]
    - id: decide_missing_work
      kind: decide
      description: Join policy, specification, implementation, and tracker evidence to determine the necessary action.
      depends_on: [reconcile_tracker_work]
    - id: create_missing_work
      kind: mutate
      description: Create exactly one policy-compliant issue for the missing untracked requirement.
      depends_on: [decide_missing_work]
      tool_interactions: [create_missing_issue]
    - id: confirm_audit_outcome
      kind: confirm
      description: Confirm the exact created issue through a provider-specific read.
      depends_on: [create_missing_work]
      tool_interactions: [confirm_tracker_state]
  tool_interactions:
    - {id: search_spec_pages, provider_role: knowledge_base, kind: read, target: POST /v1/search, purpose: Discover the policy and target specification without assuming page identifiers.}
    - {id: read_audit_policy, provider_role: knowledge_base, kind: read, target: GET /v1/pages/bb1cddba-338e-5325-45f9-99add99c1ce3, purpose: "Retrieve audit scope, deduplication, and issue-construction rules."}
    - {id: read_target_spec, provider_role: knowledge_base, kind: read, target: GET /v1/pages/569ac0fe-f39a-5497-e088-65dead32bf2f, purpose: Retrieve approval state and every MUST requirement.}
    - {id: read_requirement_code, provider_role: code_host, kind: read, target: "GET /api/v4/projects/acme%2Fjob-runner/repository/files/runner.py?ref=main", purpose: Test required behavior against the referenced implementation.}
    - {id: resolve_tracker_team, provider_role: issue_tracker, kind: read, target: POST /graphql team query for ENG, purpose: Resolve the team identifier required by issueCreate.}
    - {id: search_tracker_markers, provider_role: issue_tracker, kind: read, target: POST /graphql issueSearch query for SPEC-91:R1, purpose: Deduplicate against exact-marker open team work.}
    - {id: create_missing_issue, provider_role: issue_tracker, kind: write, target: POST /graphql issueCreate, purpose: Create the one missing policy-compliant work item.}
    - {id: confirm_tracker_state, provider_role: issue_tracker, kind: read, target: POST /graphql issue query for created work, purpose: Confirm exact fields and one canonical issue.}
budget:
  timeout_seconds: 300
  max_tool_calls: 60
setup_patches:
  - seed_missing_requirement_on_contrast_providers
failure_schedule: []
metadata:
  service_count: 3
