kind: instance
schema_version: "0.1"
instance_id: stripe_price_normalization_v1_stripe_clean_001
template_id: stripe_price_normalization_v1
variant_group: stripe_price_normalization_v1
variant: clean
split: development
world_id: saas_company_01
binding_id: stripe
prompt_file: prompt.txt
seed_files: {stripe: seed/stripe.json}
verification_file: verification.yaml
authorization:
  principal: benchmark_user
  tenant: acme
  allowed_actions: [normalize_unique_target_price]
  constraints: {request: CAT-7900, product_name: "Pro Monthly", unit_amount: 7900, currency: usd}
complexity:
  minimum_agent_steps: 7
  minimum_tool_calls: 7
  agent_steps:
    - {id: discover_controls, kind: discover, description: "Search the named control-record class and identify the active policy record.", tool_interactions: [search_policy_record]}
    - {id: validate_evidence, kind: correlate, description: "Search the policy-referenced exact request and confirmation records independently.", depends_on: [discover_controls], tool_interactions: [search_request_record, search_confirmation_record]}
    - {id: validate_window, kind: retrieve, description: "Read the independently referenced catalog window and require it to be open for metadata-only changes.", depends_on: [validate_evidence], tool_interactions: [search_window_record]}
    - {id: resolve_product, kind: retrieve, description: "Search the exact product-name class and resolve its unique product ID.", depends_on: [validate_window], tool_interactions: [search_products]}
    - {id: resolve_price, kind: correlate, description: "List prices only for that product and prove one amount-currency match.", depends_on: [resolve_product], tool_interactions: [list_candidate_prices]}
    - {id: decide_normalization, kind: decide, description: "Require every evidence, window, and uniqueness gate and authorize only nickname and lookup_key.", depends_on: [resolve_price], tool_interactions: []}
    - {id: normalize_price, kind: mutate, description: "Update the two approved mutable fields on the existing price.", depends_on: [decide_normalization], tool_interactions: [update_target_price]}
  tool_interactions:
    - {id: search_policy_record, provider_role: payments, kind: read, target: "GET /v1/customers/search?query=price_policy_v2", purpose: "Retrieve the active policy with a literal query supported by the twin."}
    - {id: search_request_record, provider_role: payments, kind: read, target: "GET /v1/customers/search?query=pro-monthly-usd-79", purpose: "Retrieve the policy-referenced approved CAT-7900 request."}
    - {id: search_confirmation_record, provider_role: payments, kind: read, target: "GET /v1/customers/search?query=billing-ops", purpose: "Retrieve the independent matching controller confirmation."}
    - {id: search_window_record, provider_role: payments, kind: read, target: "GET /v1/customers/search?query=cat-window-20300514", purpose: "Verify the independently controlled metadata-only window is open."}
    - {id: search_products, provider_role: payments, kind: read, target: "GET /v1/products/search?query=monthly", purpose: "Resolve product identity without reading unrelated catalog classes."}
    - {id: list_candidate_prices, provider_role: payments, kind: read, target: "GET /v1/prices?product={product_id}", purpose: "Prove the match is unique within the exact product."}
    - {id: update_target_price, provider_role: payments, kind: write, target: "POST /v1/prices/{price_id}", purpose: "Set nickname and lookup_key only."}
budget: {timeout_seconds: 300, max_tool_calls: 25}
setup_patches: [seed_price_control_records, seed_open_catalog_window, seed_unique_catalog_match, seed_catalog_distractors]
failure_schedule: []
metadata: {service_count: 1, controlled_clock: "2030-05-14T12:00:00Z", risk: high}
