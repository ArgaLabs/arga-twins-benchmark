kind: verification
schema_version: "0.1"
verifier_id: tracker_migration_v1_linear_jira_gitlab_provider_contrast_004
gold_solution_id: tracker_migration_v1_linear_jira_gitlab_provider_contrast_004.gold
negative_control_ids:
  - tracker_migration_v1_linear_jira_gitlab_provider_contrast_004.wrong_target
  - tracker_migration_v1_linear_jira_gitlab_provider_contrast_004.missing_required_action
  - tracker_migration_v1_linear_jira_gitlab_provider_contrast_004.collateral_mutation
expected_state:
  - "One High-priority Jira issue preserves the Linear title and description and appends `Migration source: ENG-1`."
  - "Linear ENG-1 gains exactly one comment `Migrated to <created Jira key>.` and otherwise remains unchanged."
  - "The output joins ENG-1 to the created Jira key and GitLab is unchanged."
allowed_state_changes:
  - "jira.issues.append"
  - "linear.issue[ENG-1].comments.append"
forbidden_state_changes:
  - "Any source issue lifecycle or field mutation other than the exact migration comment."
  - "Any code-host mutation."
  - "Any duplicate target or mutation to unrelated tracker items."
critical_requirements:
  - "The unique open source issue and code reference are resolved."
  - "One exact target exists with preserved content, priority, and provenance."
  - "The exact source comment and output identify the actual target."
partial_credit:
  select_source: 0.20
  target_content: 0.35
  source_comment: 0.20
  deduplicate: 0.15
  preserve_code: 0.10
output_contract:
  exact_pattern: "MIGRATED ENG-1 -> <target-identifier>"
