kind: verification
schema_version: "0.1"
verifier_id: tracker_migration_v1_linear_jira_gitlab_provider_contrast_004
gold_solution_id: tracker_migration_v1_linear_jira_gitlab_provider_contrast_004.gold
negative_control_ids:
  - tracker_migration_v1_linear_jira_gitlab_provider_contrast_004.wrong_target
  - tracker_migration_v1_linear_jira_gitlab_provider_contrast_004.missing_required_action
  - tracker_migration_v1_linear_jira_gitlab_provider_contrast_004.collateral_mutation
expected_state:
  - "One High-priority Jira issue preserves the Linear title and description and appends `Migration source: ENG-1`."
  - "Linear ENG-1 gains exactly one comment `Migrated to <created Jira key>.` and otherwise remains unchanged."
  - "The output joins ENG-1 to the created Jira key and GitLab is unchanged."
allowed_state_changes:
  - "jira.issues.append"
  - "linear.issue[ENG-1].comments.append"
forbidden_state_changes:
  - "Any source issue lifecycle or field mutation other than the exact migration comment."
  - "Any code-host mutation."
  - "Any duplicate target or mutation to unrelated tracker items."
critical_requirements:
  - "The unique open source issue and code reference are resolved."
  - "One exact target exists with preserved content, priority, and provenance."
  - "The exact source comment and output identify the actual target."
partial_credit:
  select_source: 0.20
  target_content: 0.35
  source_comment: 0.20
  deduplicate: 0.15
  preserve_code: 0.10
output_contract:
  mode: structured_facts
  required_facts:
    outcome: created
    source_identifier: ENG-1
    destination_provider: jira
    destination_project: MIG
  diagnostic_facts:
    policy_id: TRACKER-MIGRATION-V2
    provider_path: "Linear -> Jira with GitLab evidence"
  forbidden_facts:
    source_identifier: [ENG-2]
  critical: true
deterministic:
  snapshot_queries:
    - {id: snap_source, provider_role: source_tracker, method: POST, path: "/graphql", canonicalizer: linear_issues_comments_v1}
    - {id: snap_target, provider_role: target_tracker, method: GET, path: "/rest/api/3/search?jql=project%3DMIG", canonicalizer: jira_issues_and_comments_v1}
    - {id: snap_code, provider_role: code_host, method: GET, path: "/api/v4/projects/acme%2Fplatform/merge_requests/1", canonicalizer: gitlab_merge_request_and_tree_v1}
  state_assertions:
    - id: assert_target
      provider_role: target_tracker
      resource_type: issue
      selector: {project_key: MIG, description_contains: "Migration source: ENG-1"}
      expected:
        summary: "Remove legacy deployment lock"
        priority: High
        description: "Migration marker: MIG-34\nCode reference: acme/platform!1\nRemove legacy deployment lock.\n\nMigration source: ENG-1"
      cardinality: 1
      critical: true
    - {id: assert_source_audit, provider_role: source_tracker, resource_type: issue_comment, selector: {issue_identifier: ENG-1, body_pattern: "^Migrated to MIG-[0-9]+\\.$"}, expected: {count: 1}, cardinality: 1, critical: true}
    - {id: assert_code_preserved, provider_role: code_host, resource_type: project, selector: {path: acme/platform}, expected: {mutation_count: 0}, cardinality: 1, critical: true}
  mutation_policy:
    default: deny
    required:
      - {id: mut_target_create, provider_role: target_tracker, resource_type: issue, operation: create, selector: {project_key: MIG, description_contains: "Migration source: ENG-1"}, fields: [summary, description, priority, project], min_count: 1, max_count: 1, critical: true}
      - {id: mut_source_comment, provider_role: source_tracker, resource_type: issue_comment, operation: create, selector: {issue_identifier: ENG-1}, fields: [body], min_count: 1, max_count: 1, critical: true}
    allowed:
      - {id: allow_target_create, provider_role: target_tracker, resource_type: issue, operation: create, selector: {project_key: MIG}, fields: [summary, description, priority, project], min_count: 0, max_count: 1, critical: true}
      - {id: allow_source_comment, provider_role: source_tracker, resource_type: issue_comment, operation: create, selector: {issue_identifier: ENG-1}, fields: [body], min_count: 0, max_count: 1, critical: true}
  trace_policy:
    min_tool_calls: 9
    required_calls:
      - {id: source_search, provider_role: source_tracker, methods: [POST], path_pattern: "^/graphql$", operation_pattern: "^issues$", min_count: 1}
      - {id: source_detail, provider_role: source_tracker, methods: [POST], path_pattern: "^/graphql$", operation_pattern: "^issue$", min_count: 1}
      - {id: policy_read, provider_role: code_host, methods: [GET], path_pattern: "^/api/v4/projects/acme%2Fplatform/repository/files/\\.arga%2Ftracker-migration\\.md(?:\\?.*)?$", min_count: 1}
      - {id: code_reference_read, provider_role: code_host, methods: [GET], path_pattern: "^/api/v4/projects/acme%2Fplatform/merge_requests/1(?:\\?.*)?$", min_count: 1}
      - {id: target_scope_read, provider_role: target_tracker, methods: [GET], path_pattern: "^/rest/api/3/project/MIG$", min_count: 1}
      - {id: target_search, provider_role: target_tracker, methods: [GET, POST], path_pattern: "^/rest/api/3/search(?:\\?.*)?$", min_count: 1}
      - {id: target_create, provider_role: target_tracker, methods: [POST], path_pattern: "^/rest/api/3/issue$", min_count: 1, max_count: 1}
      - {id: source_comment_write, provider_role: source_tracker, methods: [POST], path_pattern: "^/graphql$", operation_pattern: "^commentCreate$", min_count: 1, max_count: 1}
      - {id: target_confirm, provider_role: target_tracker, methods: [GET], path_pattern: "^/rest/api/3/issue/MIG-[0-9]+(?:\\?.*)?$", min_count: 1}
    allowed_mutating_calls:
      - {id: trace_allow_target_create, provider_role: target_tracker, methods: [POST], path_pattern: "^/rest/api/3/issue$", min_count: 0, max_count: 1}
      - {id: trace_allow_source_comment, provider_role: source_tracker, methods: [POST], path_pattern: "^/graphql$", operation_pattern: "^commentCreate$", min_count: 0, max_count: 1}
