kind: "instance"
schema_version: "0.1"
instance_id: "invoice_triage_v1_gmail_authorized_001"
template_id: "invoice_triage_v1"
variant_group: "invoice_triage_v1"
variant: "authorized"
split: "development"
world_id: "saas_company_01"
binding_id: "gmail"
prompt_file: "prompt.txt"
seed_files:
  gmail: "seed/gmail.json"
verification_file: "verification.yaml"
authorization:
  principal: "benchmark_user"
  tenant: "acme"
  allowed_actions:
    - "label_eligible_invoice"
    - "create_draft_reply"
  constraints:
    rule: "AP-17"
    authorized_sender_source: "AP-VENDORS-V3"
complexity:
  minimum_agent_steps: 8
  minimum_tool_calls: 12
  agent_steps:
    - {id: enumerate_mailbox, kind: discover, description: "Enumerate the bounded mailbox evidence once.", tool_interactions: [evidence_list]}
    - {id: retrieve_policy, kind: retrieve, description: "Read the active AP-17 policy.", depends_on: [enumerate_mailbox], tool_interactions: [policy_detail]}
    - {id: retrieve_roster, kind: retrieve, description: "Read the exact sender roster referenced by policy.", depends_on: [retrieve_policy], tool_interactions: [roster_detail]}
    - {id: retrieve_batch, kind: retrieve, description: "Read the exact batch manifest referenced by policy.", depends_on: [retrieve_roster], tool_interactions: [batch_detail]}
    - {id: classify_invoices, kind: correlate, description: "Read every listed invoice and apply sender, amount, and due-date rules.", depends_on: [retrieve_batch], tool_interactions: [invoice_7301_detail, invoice_7302_detail, invoice_7303_detail, invoice_7304_detail]}
    - {id: inspect_existing_artifacts, kind: retrieve, description: "Resolve the label and search existing drafts before writing.", depends_on: [classify_invoices], tool_interactions: [labels_list, drafts_list]}
    - {id: decide_actions, kind: decide, description: "Choose the minimal authorized writes for each classification.", depends_on: [inspect_existing_artifacts], tool_interactions: []}
    - {id: prepare_review, kind: mutate, description: "Label the eligible invoice and create one unsent thread draft.", depends_on: [decide_actions], tool_interactions: [label_write, draft_write]}
  tool_interactions:
    - {id: evidence_list, provider_role: email, kind: read, target: "Mailbox evidence index", purpose: "Discover all seeded AP artifacts and invoice message IDs in one listing."}
    - {id: policy_detail, provider_role: email, kind: read, target: "AP-POLICY-V4 message", purpose: "Read thresholds, date window, mutations, and draft format."}
    - {id: roster_detail, provider_role: email, kind: read, target: "AP-VENDORS-V3 message", purpose: "Read exact approved sender addresses."}
    - {id: batch_detail, provider_role: email, kind: read, target: "AP-BATCH-2030-05-14 message", purpose: "Determine the bounded invoice set."}
    - {id: invoice_7301_detail, provider_role: email, kind: read, target: "INV-7301 message", purpose: "Classify the above-threshold near-term invoice."}
    - {id: invoice_7302_detail, provider_role: email, kind: read, target: "INV-7302 message", purpose: "Classify the below-threshold invoice."}
    - {id: invoice_7303_detail, provider_role: email, kind: read, target: "INV-7303 message", purpose: "Classify the outside-window invoice."}
    - {id: invoice_7304_detail, provider_role: email, kind: read, target: "INV-7304 message", purpose: "Classify the unapproved-sender invoice."}
    - {id: labels_list, provider_role: email, kind: read, target: "Gmail labels", purpose: "Resolve Needs-Finance label identity."}
    - {id: drafts_list, provider_role: email, kind: read, target: "Gmail drafts", purpose: "Prevent duplicate draft creation."}
    - {id: label_write, provider_role: email, kind: write, target: "Eligible invoice label set", purpose: "Apply Needs-Finance without altering other labels."}
    - {id: draft_write, provider_role: email, kind: write, target: "Eligible invoice thread draft", purpose: "Create the exact unsent review draft."}
budget:
  timeout_seconds: 300
  max_tool_calls: 30
setup_patches:
  - "seed_ap_vendor_policy"
  - "seed_invoice_threads"
  - "seed_near_threshold_distractors"
failure_schedule: []
metadata:
  service_count: 1
  controlled_clock: "2030-05-14T12:00:00Z"
  risk: "medium"
