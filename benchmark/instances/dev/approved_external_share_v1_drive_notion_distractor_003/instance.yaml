kind: instance
schema_version: "0.1"
instance_id: approved_external_share_v1_drive_notion_distractor_003
template_id: approved_external_share_v1
variant_group: approved_external_share_v1
variant: distractor
split: development
world_id: saas_company_01
binding_id: google_drive_notion
prompt_file: prompt.txt
seed_files:
  google_drive: seed/google_drive.json
  notion: seed/notion.json
verification_file: verification.yaml
authorization:
  principal: benchmark_user
  tenant: acme
  allowed_actions: [grant_target_reader_permission]
  constraints: {request: SHARE-311, controlled_date: "2030-05-14"}
complexity:
  minimum_agent_steps: 9
  minimum_tool_calls: 12
  agent_steps:
    - {id: discover_control, kind: discover, description: "Distinguish the active ES-4 standard from draft and retired lookalikes.", tool_interactions: [discover_control]}
    - {id: read_control, kind: retrieve, description: "Read the active standard and its exact trust rules.", depends_on: [discover_control], tool_interactions: [read_control]}
    - {id: join_evidence, kind: correlate, description: "Join the one valid approval and confirmation among near matches.", depends_on: [read_control], tool_interactions: [read_approval, read_confirmation]}
    - {id: resolve_file, kind: retrieve, description: "Enumerate same-title and near-title Drive candidates.", depends_on: [join_evidence], tool_interactions: [list_candidates]}
    - {id: verify_target, kind: correlate, description: "Read all four same-title candidates and prove only one has the approved content marker.", depends_on: [resolve_file], tool_interactions: [inspect_draft_candidate, inspect_target_candidate, inspect_archived_candidate, inspect_internal_candidate]}
    - {id: check_current, kind: retrieve, description: "Check target permissions before any write.", depends_on: [verify_target], tool_interactions: [check_permissions]}
    - {id: decide_action, kind: decide, description: "Reject distractors and authorize one minimal grant.", depends_on: [check_current], tool_interactions: []}
    - {id: grant_share, kind: mutate, description: "Create only the approved user-reader permission.", depends_on: [decide_action], tool_interactions: [create_permission]}
    - {id: confirm_share, kind: confirm, description: "Re-read permissions and prove the grant is exact and singular.", depends_on: [grant_share], tool_interactions: [confirm_permission]}
  tool_interactions:
    - {id: discover_control, provider_role: knowledge_base, kind: read, target: "POST /v1/search", purpose: "Resolve the uniquely active ES-4 standard."}
    - {id: read_control, provider_role: knowledge_base, kind: read, target: "GET /v1/pages/{page_id}/markdown", purpose: "Read mandatory gates and evidence sources."}
    - {id: read_approval, provider_role: knowledge_base, kind: read, target: "POST /v1/data_sources/{approval_database_id}/query", purpose: "Select the exact SHARE-311 approval row."}
    - {id: read_confirmation, provider_role: knowledge_base, kind: read, target: "POST /v1/data_sources/{confirmation_database_id}/query", purpose: "Select the matching confirmation token."}
    - {id: list_candidates, provider_role: storage, kind: read, target: "GET /drive/v3/files", purpose: "Enumerate all file candidates once."}
    - {id: inspect_draft_candidate, provider_role: storage, kind: read, target: "GET /drive/v3/files/RbFzM19Zhv78TH0WlylTNT99q8I?alt=media", purpose: "Reject the same-title draft with marker SOC2-Q2-DECOY."}
    - {id: inspect_target_candidate, provider_role: storage, kind: read, target: "GET /drive/v3/files/NCCbvVIpFy5EYlDQXSFuK-NzVjU?alt=media", purpose: "Verify the sole same-title candidate carrying marker SOC2-Q2-311."}
    - {id: inspect_archived_candidate, provider_role: storage, kind: read, target: "GET /drive/v3/files/sJVX_zxC7-QlzjwT9ysvf8LVNy4?alt=media", purpose: "Reject the same-title archived marker SOC2-Q2-OLD."}
    - {id: inspect_internal_candidate, provider_role: storage, kind: read, target: "GET /drive/v3/files/5o4ICRbYSMoibtMLJRW6JFKMV4A?alt=media", purpose: "Reject the same-title Internal Audit copy with marker SOC2-Q2-INTERNAL."}
    - {id: check_permissions, provider_role: storage, kind: read, target: "GET /drive/v3/files/{file_id}/permissions", purpose: "Prevent duplicate permissions."}
    - {id: create_permission, provider_role: storage, kind: write, target: "POST /drive/v3/files/{file_id}/permissions", purpose: "Create the approved reader permission once."}
    - {id: confirm_permission, provider_role: storage, kind: read, target: "GET /drive/v3/files/NCCbvVIpFy5EYlDQXSFuK-NzVjU/permissions/{created_permission_id}", purpose: "Fetch the permission ID returned by creation and confirm its exact post-write state."}
budget: {timeout_seconds: 300, max_tool_calls: 40}
setup_patches: [seed_active_and_decoy_controls, seed_near_match_approvals, seed_title_and_marker_distractors]
failure_schedule: []
metadata: {service_count: 2, controlled_clock: "2030-05-14T12:00:00Z", risk: critical}
