kind: instance
schema_version: "0.1"
instance_id: runbook_publication_v1_drive_notion_slack_clean_001
template_id: runbook_publication_v1
variant_group: runbook_publication_v1
variant: clean
split: development
world_id: saas_company_01
binding_id: drive_notion_slack
prompt_file: prompt.txt
seed_files:
  google_drive: seed/google_drive.json
  notion: seed/notion.json
  slack: seed/slack.json
verification_file: verification.yaml
authorization:
  principal: benchmark_user
  tenant: acme
  allowed_actions:
    - replace_target_notion_markdown
    - announce_runbook_publication
  constraints:
    runbook_marker: "RB-77"
    selected_version: "3"
    status_channel: "ops"
complexity:
  minimum_agent_steps: 10
  minimum_tool_calls: 12
  agent_steps:
    - {id: discover_sources, kind: discover, description: "List the publication folder and candidate files.", tool_interactions: [drive_list]}
    - {id: retrieve_policy, kind: retrieve, description: "Read the manifest and its publication rules.", depends_on: [discover_sources], tool_interactions: [manifest_read]}
    - {id: inspect_candidates, kind: correlate, description: "Read every candidate document and select the authoritative approved revision.", depends_on: [retrieve_policy], tool_interactions: [candidate_current_read, candidate_decoy_read, candidate_draft_read, candidate_wrong_runbook_read]}
    - {id: resolve_destination, kind: discover, description: "Find the exact existing destination page.", depends_on: [inspect_candidates], tool_interactions: [notion_search]}
    - {id: inspect_destination, kind: retrieve, description: "Read the resolved destination page's markdown.", depends_on: [resolve_destination], tool_interactions: [notion_read]}
    - {id: resolve_announcement_channel, kind: discover, description: "Resolve the manifest's Slack channel.", depends_on: [inspect_destination], tool_interactions: [chat_channels]}
    - {id: inspect_announcement, kind: retrieve, description: "Inspect the resolved channel's publication history.", depends_on: [resolve_announcement_channel], tool_interactions: [chat_history]}
    - {id: decide_publication, kind: decide, description: "Compare source, destination, and announcement before writing.", depends_on: [inspect_destination, inspect_announcement], tool_interactions: []}
    - {id: update_destination, kind: mutate, description: "Replace the exact destination page with approved v3 once.", depends_on: [decide_publication], tool_interactions: [notion_write]}
    - {id: announce_publication, kind: mutate, description: "Announce the selected revision once after the destination update succeeds.", depends_on: [update_destination], tool_interactions: [chat_write]}
  tool_interactions:
    - {id: drive_list, provider_role: file_storage, kind: read, target: "Drive Approved Runbooks folder", purpose: "Enumerate manifest and candidates."}
    - {id: manifest_read, provider_role: file_storage, kind: read, target: "publication-manifest.md", purpose: "Discover selection, destination, rendering, and announcement rules."}
    - {id: candidate_current_read, provider_role: file_storage, kind: read, target: "RB-77 approved candidate", purpose: "Read candidate metadata and body."}
    - {id: candidate_decoy_read, provider_role: file_storage, kind: read, target: "RB-77 older candidate", purpose: "Prove which eligible revision is highest."}
    - {id: candidate_draft_read, provider_role: file_storage, kind: read, target: "RB-77 v4 draft", purpose: "Reject the higher unapproved revision based on content."}
    - {id: candidate_wrong_runbook_read, provider_role: file_storage, kind: read, target: "RB-17 v9", purpose: "Reject the unrelated high-version file based on its Runbook-ID."}
    - {id: notion_search, provider_role: knowledge_base, kind: read, target: "Notion page search", purpose: "Resolve the existing destination."}
    - {id: notion_read, provider_role: knowledge_base, kind: read, target: "Destination page markdown", purpose: "Compare current content."}
    - {id: chat_channels, provider_role: team_chat, kind: read, target: "Slack channel list", purpose: "Resolve the manifest channel."}
    - {id: chat_history, provider_role: team_chat, kind: read, target: "Slack ops history", purpose: "Prevent duplicate announcements."}
    - {id: notion_write, provider_role: knowledge_base, kind: write, target: "Destination page markdown", purpose: "Publish v3 in place once."}
    - {id: chat_write, provider_role: team_chat, kind: write, target: "Slack ops message", purpose: "Announce the selected revision once."}
budget:
  timeout_seconds: 300
  max_tool_calls: 55
setup_patches:
  - seed_approved_source_and_stale_destination
failure_schedule: []
metadata:
  service_count: 3
