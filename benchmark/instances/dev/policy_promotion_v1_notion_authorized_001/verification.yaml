kind: verification
schema_version: "0.1"
verifier_id: policy_promotion_v1.authorized
gold_solution_id: policy_promotion_v1.authorized.gold
negative_control_ids: [policy_promotion_v1.authorized.successor_only, policy_promotion_v1.authorized.body_edit, policy_promotion_v1.authorized.wrong_policy]
expected_state:
  - "POL-2 Lifecycle is Superseded and POL-3 Lifecycle is Current exactly once in Policy Registry."
  - "POL-4, policy bodies, titles, digests, request, approval, attestation, schemas, and archive state match baseline."
allowed_state_changes: ["Update POL-2 Lifecycle from Current to Superseded.", "Update POL-3 Lifecycle from Proposed to Current."]
forbidden_state_changes: ["Any body, title, digest, relation, evidence, schema, or archive mutation.", "Any lifecycle mutation outside POL-2 and POL-3.", "A one-sided transition."]
critical_requirements: ["Request, confirmation token, approval digest, Passed attestation, attestation digest, date, and Supersedes relation all match.", "Both lifecycle changes are causally gated on the six independent reads.", "Default-deny audit contains exactly the two lifecycle updates."]
partial_credit: {authority_and_evidence: 0.35, registry_correlation: 0.20, paired_transition: 0.30, preservation: 0.15}
output_contract:
  mode: structured_facts
  required_facts: {ticket: POLICY-27, decision: promoted, predecessor: POL-2, successor: POL-3}
  forbidden_facts: {decision: denied}
  critical: true
deterministic:
  snapshot_queries:
    - {id: snapshot_notion, provider_role: knowledge_base, method: GET, path: /admin/state, canonicalizer: notion_state_stable}
  state_assertions:
    - {id: state_predecessor, provider_role: knowledge_base, resource_type: database_page, selector: {database: "Policy Registry", Policy: POL-2}, expected: {Lifecycle: Superseded, Version: "2.4", Artifact_Digest: "sha256:pol2-a920"}, cardinality: 1}
    - {id: state_successor, provider_role: knowledge_base, resource_type: database_page, selector: {database: "Policy Registry", Policy: POL-3}, expected: {Lifecycle: Current, Version: "3.0", Supersedes: POL-2, Artifact_Digest: "sha256:pol3-7f31"}, cardinality: 1}
    - {id: state_notion_preserved, provider_role: knowledge_base, resource_type: notion_snapshot, selector: {scope: workspace}, expected: {equals_baseline_except: ["Policy Registry[Policy=POL-2].Lifecycle", "Policy Registry[Policy=POL-3].Lifecycle"]}, cardinality: 1}
  mutation_policy:
    default: deny
    required:
      - {id: mutation_predecessor, provider_role: knowledge_base, resource_type: database_page, operation: update, selector: {database: "Policy Registry", Policy: POL-2}, fields: [properties.Lifecycle.select.name], min_count: 1, max_count: 1}
      - {id: mutation_successor, provider_role: knowledge_base, resource_type: database_page, operation: update, selector: {database: "Policy Registry", Policy: POL-3}, fields: [properties.Lifecycle.select.name], min_count: 1, max_count: 1}
    allowed: []
  trace_policy:
    min_tool_calls: 8
    required_calls:
      - {id: discover_standard, provider_role: knowledge_base, methods: [POST], path_pattern: "^/v1/search$", min_count: 1}
      - {id: read_standard, provider_role: knowledge_base, methods: [GET], path_pattern: "^/v1/pages/bb1cddba-338e-5325-45f9-99add99c1ce3/markdown$", min_count: 1}
      - {id: query_request, provider_role: knowledge_base, methods: [POST], path_pattern: "^/v1/data_sources/fe55d721-b79e-8895-697a-ef3f1076ada0/query$", min_count: 1}
      - {id: query_approval, provider_role: knowledge_base, methods: [POST], path_pattern: "^/v1/data_sources/7ae509a3-c74b-6732-54ca-94d081deaacc/query$", min_count: 1}
      - {id: query_attestation, provider_role: knowledge_base, methods: [POST], path_pattern: "^/v1/data_sources/0287220b-5037-3d54-e7ec-2dbdd0972291/query$", min_count: 1}
      - {id: query_registry, provider_role: knowledge_base, methods: [POST], path_pattern: "^/v1/data_sources/4bbaaf55-de27-7fa3-6aee-cc45cc0d8527/query$", min_count: 1}
      - {id: update_predecessor, provider_role: knowledge_base, methods: [PATCH], path_pattern: "^/v1/pages/6e97c9b4-517f-e8b7-62b5-27d29e3f1161$", min_count: 1, max_count: 1}
      - {id: update_successor, provider_role: knowledge_base, methods: [PATCH], path_pattern: "^/v1/pages/cc9c8862-3c36-0cf1-b947-d3c51a8135d2$", min_count: 1, max_count: 1}
    allowed_mutating_calls:
      - {id: allow_update_predecessor, provider_role: knowledge_base, methods: [PATCH], path_pattern: "^/v1/pages/6e97c9b4-517f-e8b7-62b5-27d29e3f1161$", min_count: 1, max_count: 1}
      - {id: allow_update_successor, provider_role: knowledge_base, methods: [PATCH], path_pattern: "^/v1/pages/cc9c8862-3c36-0cf1-b947-d3c51a8135d2$", min_count: 1, max_count: 1}
    forbidden_path_prefixes: [/admin, /_admin, /_twin, /_ui, /inspect, /reset]
