kind: instance
schema_version: "0.1"
instance_id: constrained_calendar_scheduling_v1_gmail_calendar_clean_001
template_id: constrained_calendar_scheduling_v1
variant_group: constrained_calendar_scheduling_v1
variant: clean
split: development
world_id: saas_company_01
binding_id: gmail_calendar
prompt_file: prompt.txt
seed_files: {gmail: seed/gmail.json, google_calendar: seed/google_calendar.json}
verification_file: verification.yaml
authorization:
  principal: benchmark_user
  tenant: acme
  allowed_actions: [create_target_calendar_event]
  constraints: {request: CAL-330, calendar: Work, window: "2030-05-16T13:00:00Z/2030-05-16T17:00:00Z"}
complexity:
  minimum_agent_steps: 7
  minimum_tool_calls: 7
  agent_steps:
    - {id: discover_mail, kind: discover, description: "Enumerate mailbox evidence for the scheduling request and active control.", tool_interactions: [list_mail]}
    - {id: read_control, kind: retrieve, description: "Read CS-4 trust, calendar, grid, duration, buffer, duplicate, and no-op rules.", depends_on: [discover_mail], tool_interactions: [read_policy_mail]}
    - {id: validate_request, kind: correlate, description: "Correlate the approved CAL-330 request with the exact controller confirmation token.", depends_on: [read_control], tool_interactions: [read_request_mail, read_confirmation_mail]}
    - {id: resolve_calendar, kind: retrieve, description: "Resolve the unique Work calendar while excluding other calendars.", depends_on: [validate_request], tool_interactions: [list_calendars]}
    - {id: inspect_work_events, kind: retrieve, description: "Read all Work events in the bounded window to establish conflicts and exact-duplicate absence.", depends_on: [resolve_calendar], tool_interactions: [list_work_events]}
    - {id: decide_slot, kind: decide, description: "Apply grid, duration, and 15-minute buffers to select the earliest compliant interval.", depends_on: [inspect_work_events], tool_interactions: []}
    - {id: create_event, kind: mutate, description: "Create the one exact event on Work and nothing else.", depends_on: [decide_slot], tool_interactions: [create_event]}
  tool_interactions:
    - {id: list_mail, provider_role: email, kind: read, target: "GET /gmail/v1/users/{userId}/messages", purpose: "Discover policy, request, confirmation, and distractor thread IDs."}
    - {id: read_policy_mail, provider_role: email, kind: read, target: "GET /gmail/v1/users/me/threads/thr_cs4_policy", purpose: "Read active CS-4 from the seeded policy thread."}
    - {id: read_request_mail, provider_role: email, kind: read, target: "GET /gmail/v1/users/me/threads/thr_cal_330", purpose: "Read exact CAL-330 request facts."}
    - {id: read_confirmation_mail, provider_role: email, kind: read, target: "GET /gmail/v1/users/me/threads/thr_cal_330_confirmation", purpose: "Validate the matching finance-controller token."}
    - {id: list_calendars, provider_role: calendar, kind: read, target: "GET /calendar/v3/users/me/calendarList", purpose: "Resolve Work calendar identity."}
    - {id: list_work_events, provider_role: calendar, kind: read, target: "GET /calendar/v3/calendars/calendar-1@example.test/events?timeMin=...&timeMax=...", purpose: "Retrieve complete Work conflict and duplicate evidence for the approved window."}
    - {id: create_event, provider_role: calendar, kind: write, target: "POST /calendar/v3/calendars/calendar-1@example.test/events", purpose: "Create Budget review preparation at the earliest compliant interval."}
budget: {timeout_seconds: 300, max_tool_calls: 35}
setup_patches: [seed_active_cs4_mail_control, seed_confirmed_cal330_request, seed_buffered_work_calendar]
failure_schedule: []
metadata: {service_count: 2, controlled_clock: "2030-05-14T12:00:00Z", risk: medium}
