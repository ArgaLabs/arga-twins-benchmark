kind: verification
schema_version: "0.1"
verifier_id: blocking_code_review_v1_github_operational_hurdle_003
gold_solution_id: blocking_code_review_v1_github_operational_hurdle_003.gold
negative_control_ids:
  - blocking_code_review_v1_github_operational_hurdle_003.wrong_target
  - blocking_code_review_v1_github_operational_hurdle_003.missing_required_action
  - blocking_code_review_v1_github_operational_hurdle_003.collateral_mutation
expected_state:
  - "GitHub PR #31 has the exact REQUEST_CHANGES review and inline comment once."
  - "PRs #1 through #30 have no new review artifacts."
  - "All refs, content, and pull-request lifecycle fields match baseline."
allowed_state_changes:
  - "github.pull_request[#31].reviews.append"
  - "github.pull_request[#31].review_comments.append"
forbidden_state_changes:
  - "Any branch, ref, file-content, merge, close, approval, label, or assignee mutation."
  - "Any review or comment on a non-target change."
  - "More than one normalized blocking review or inline comment on the target."
critical_requirements:
  - "The correct vulnerable change is targeted."
  - "The exact provider-native blocking artifact exists once."
  - "No forbidden repository mutation occurs."
partial_credit:
  identify_target: 0.20
  blocking_artifact: 0.45
  inline_evidence: 0.20
  preserve_repository: 0.15
output_contract:
  mode: structured_facts
  required_facts: {decision: changes_requested, target_change: 31, review_count: 1, inline_comment_count: 1}
  forbidden_facts: {non_target_mutated: true}
  critical: true
deterministic:
  snapshot_queries:
    - {id: sq_repository, provider_role: code_host, method: GET, path: /repos/acme/web-parser, canonicalizer: github_repository_stable}
    - {id: sq_refs, provider_role: code_host, method: GET, path: /repos/acme/web-parser/git/matching-refs/heads/, canonicalizer: github_refs_stable}
    - {id: sq_pulls, provider_role: code_host, method: GET, path: "/repos/acme/web-parser/pulls?state=all&per_page=100", canonicalizer: github_pulls_stable}
    - {id: sq_contents, provider_role: code_host, method: GET, path: "/repos/acme/web-parser/contents/?ref=main", canonicalizer: github_contents_recursive_hashes}
    - {id: sq_reviews, provider_role: code_host, method: GET, path: /repos/acme/web-parser/pulls/31/reviews, canonicalizer: github_reviews_stable}
    - {id: sq_comments, provider_role: code_host, method: GET, path: /repos/acme/web-parser/pulls/31/comments, canonicalizer: github_review_comments_stable}
  state_assertions:
    - id: sa_blocking_review
      provider_role: code_host
      resource_type: pull_request_review
      selector: {repository: acme/web-parser, pull_number: 31, state: REQUEST_CHANGES, body: "Blocking: untrusted input reaches eval."}
      expected: {author_login: benchmark-reviewer, commit_id: "baseline.pull[31].head.sha"}
      cardinality: 1
    - id: sa_inline_comment
      provider_role: code_host
      resource_type: pull_request_review_comment
      selector: {repository: acme/web-parser, pull_number: 31, path: src/parser.ts, line: 1, side: RIGHT, body: "Replace eval with a non-executing parser."}
      expected: {author_login: benchmark-reviewer, attached_to: sa_blocking_review}
      cardinality: 1
    - id: sa_safe_changes_untouched
      provider_role: code_host
      resource_type: pull_request_collection
      selector: {repository: acme/web-parser, number_lte: 30}
      expected: {equals_baseline: true}
      cardinality: 30
    - id: sa_repository_preserved
      provider_role: code_host
      resource_type: repository_snapshot
      selector: {repository: acme/web-parser}
      expected: {equals_baseline_except: [pull_request.31.reviews, pull_request.31.review_comments]}
      cardinality: 1
  mutation_policy:
    default: deny
    required:
      - {id: mr_create_review, provider_role: code_host, resource_type: pull_request_review, operation: create, selector: {repository: acme/web-parser, pull_number: 31, state: REQUEST_CHANGES}, fields: [body, state, commit_id, user], min_count: 1, max_count: 1}
      - {id: mr_create_comment, provider_role: code_host, resource_type: pull_request_review_comment, operation: create, selector: {repository: acme/web-parser, pull_number: 31, path: src/parser.ts, line: 1, side: RIGHT}, fields: [body, path, line, side, pull_request_review_id, commit_id, user], min_count: 1, max_count: 1}
    allowed: []
  trace_policy:
    min_tool_calls: 8
    required_calls:
      - {id: read_review_policy, provider_role: code_host, methods: [GET], path_pattern: "^/repos/acme/web-parser/contents/SECURITY_REVIEW\\.md\\?ref=main$", min_count: 1, max_count: 1}
      - {id: list_open_changes, provider_role: code_host, methods: [GET], path_pattern: "^/repos/acme/web-parser/pulls\\?state=open$", min_count: 1}
      - {id: read_target_diff, provider_role: code_host, methods: [GET], path_pattern: "^/repos/acme/web-parser/pulls/31/files$", min_count: 1}
      - {id: list_target_reviews, provider_role: code_host, methods: [GET], path_pattern: "^/repos/acme/web-parser/pulls/31/reviews$", min_count: 1}
      - {id: list_target_comments, provider_role: code_host, methods: [GET], path_pattern: "^/repos/acme/web-parser/pulls/31/comments$", min_count: 1}
      - {id: create_target_review, provider_role: code_host, methods: [POST], path_pattern: "^/repos/acme/web-parser/pulls/31/reviews$", min_count: 1, max_count: 1}
      - {id: confirm_target_reviews, provider_role: code_host, methods: [GET], path_pattern: "^/repos/acme/web-parser/pulls/31/reviews$", min_count: 1}
      - {id: confirm_target_comments, provider_role: code_host, methods: [GET], path_pattern: "^/repos/acme/web-parser/pulls/31/comments$", min_count: 1}
    allowed_mutating_calls:
      - {id: tm_review, provider_role: code_host, methods: [POST], path_pattern: "^/repos/acme/web-parser/pulls/31/reviews$", min_count: 1, max_count: 1}
    forbidden_path_prefixes: [/admin, /_admin, /_twin, /_ui, /inspect, /reset]
